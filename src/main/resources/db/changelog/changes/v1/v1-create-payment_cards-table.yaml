databaseChangeLog:
  - changeSet:
      id: v1-create-payment_cards-table
      author: daniilradkovich
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: "payment_cards"
      changes:
        - createTable:
            tableName: payment_cards
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: number
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: holder
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: expiration_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: payment_cards
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_payment_cards_user_id
            onDelete: CASCADE
            onUpdate: CASCADE

        - createIndex:
            indexName: idx_payment_cards_user_id
            tableName: payment_cards
            unique: false
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_payment_cards_active
            tableName: payment_cards
            unique: false
            columns:
              - column:
                  name: active